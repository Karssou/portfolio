name: Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Deploy to Raspberry Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            YELLOW='\033[1;33m'
            NC='\033[0m'

            APP_PATH="$HOME/Portfolio"

            echo -e "${YELLOW}=== Début du déploiement du portfolio ===${NC}"

            # Vérification du dossier
            cd "$APP_PATH" || {
              echo -e "${RED}❌ Impossible d'accéder au dossier ${APP_PATH}${NC}"
              exit 1
            }

            echo -e "${YELLOW}📥 Mise à jour du code source...${NC}"

            # Récupération de la dernière version depuis GitHub
            git fetch origin main
            git reset --hard origin/main

            echo -e "${YELLOW}🔄 Arrêt du conteneur existant...${NC}"

            docker compose -f docker-compose.yml down || true

            echo -e "${YELLOW}🐳 Construction et lancement du conteneur...${NC}"

            docker compose -f docker-compose.yml up \
              --build \
              -d \
              --remove-orphans || {
                echo -e "${RED}❌ Erreur lors du démarrage du conteneur${NC}"
                exit 1
              }

            echo -e "${YELLOW}⏳ Vérification du conteneur...${NC}"

            sleep 5

            if docker ps | grep -q "portfolio"; then
              echo -e "${GREEN}============================${NC}"
              echo -e "${GREEN}✨ Déploiement du portfolio terminé avec succès ! ✨${NC}"
              echo -e "${GREEN}============================${NC}"
            else
              echo -e "${RED}❌ ÉCHEC : Le conteneur portfolio n'est pas démarré.${NC}"
              echo -e "${YELLOW}📋 Logs du conteneur :${NC}"
              docker compose -f docker-compose.yml logs --tail=100
              exit 1
            fi

            echo -e "${YELLOW}🧹 Nettoyage des images Docker inutilisées...${NC}"

            docker image prune -f || {
              echo -e "${RED}❌ Erreur lors du nettoyage${NC}"
              exit 1
            }

